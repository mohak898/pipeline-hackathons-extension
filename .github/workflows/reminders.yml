# Fallback scheduler for deadline reminders (use when your host has no cron,
# or you're on Vercel Hobby where crons run at most once a day).
# Repo → Settings → Secrets and variables → Actions: add DASHBOARD_URL and CRON_SECRET.
name: Deadline reminders
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger reminder run
        env:
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$DASHBOARD_URL" ]; then echo "DASHBOARD_URL not set — skipping"; exit 0; fi
          curl -fsS -H "Authorization: Bearer $CRON_SECRET" "$DASHBOARD_URL/api/cron/reminders"
